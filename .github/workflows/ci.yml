name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Python tests
        run: |
          . .venv/bin/activate
          python -m pytest
      - name: Run Python lint
        run: |
          . .venv/bin/activate
          python -m ruff check .
      - name: Check whitespace
        run: git diff --check

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftPM tests
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
      - name: Build SwiftPM app
        run: swift build
