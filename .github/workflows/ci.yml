name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pytest pydub inflect nltk pyspellchecker emoji geopy
      - name: Run Python tests
        run: |
          . .venv/bin/activate
          python -m pytest

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftPM app
        run: swift build
